name: NotebookGame

# Fallback project definition for XcodeGen (`brew install xcodegen && xcodegen`).
# The checked-in NotebookGame.xcodeproj is the primary project; this file exists
# so the project can be regenerated on older Xcode versions that do not
# understand file-system synchronized groups.

options:
  bundleIdPrefix: com.jrubiosainz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  NotebookGame:
    type: application
    platform: iOS
    sources:
      - path: NotebookGame
      # A folder reference, so assets/<category>/<name>.png survives into the
      # bundle exactly as the Python generator wrote it.
      - path: ../assets
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jrubiosainz.notebookgame
        PRODUCT_NAME: NotebookGame
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Notebook Quest"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
